# Render Blueprint additions for the Earnings Intelligence pipeline.
#
# This file defines three Cron Job services that let the XBRL, promise-
# extraction and promise re-evaluation pipelines keep running without a human
# (or Claude) driving them from a laptop. It does NOT redefine the existing
# backend web service -- only add these new services when connecting this
# Blueprint via the
# Render dashboard (New > Blueprint), so the already-configured web service
# is left untouched. Committing this file changes nothing live by itself;
# a person must explicitly connect the Blueprint in Render for these jobs to
# start running.
#
# All jobs need the SAME environment variables the existing web service
# already has (MONGODB_URI, OPENAI_API_KEY, INDIAN_API_KEY, etc.). The
# cleanest way to share them without re-entering secrets is an Environment
# Group in the Render dashboard (Environment > Groups) attached to both the
# web service and these cron jobs -- `fromGroup` below assumes one named
# `growth-squad-earnings`; rename it to match whatever the operator creates
# (or remove `envVarGroups` and add the variables directly on each job).
#
# NEITHER job sends a notification anywhere on failure or on finding a new
# reconciliation problem: Render's own "Notify on failure" setting (per
# service, in its dashboard Settings > Notifications) is the only alerting
# that exists today. There is no Slack/email hook in this codebase. See the
# session report for what else remains before this can run fully unattended.
#
# The SEPARATE stock-data pipeline (historical prices, derived metrics,
# company profiles/market caps, fundamentals, investment products -- what
# Goals' "Load Eligible Stocks" reads) is scheduled independently, as a
# GitHub Actions workflow (.github/workflows/stocks-data-refresh.yml), not a
# Render Cron Job here -- see that file's own header for why. Activating it
# needs the repo secrets it documents, not a Render Blueprint connection.

services:
  - type: cron
    name: earnings-xbrl-refresh
    runtime: node
    rootDir: backend
    plan: starter
    # Weekly: quarterly results cluster within ~45 days of each fiscal quarter-end (mid Apr/Jul/Oct/Jan),
    # so a weekly run picks up a newly-filed quarter within days without hammering NSE the rest of the time.
    schedule: "0 3 * * 1"
    buildCommand: npm ci --omit=dev
    # --scope with-facts revisits every company that already has data (not just ones with a gap), which is
    # what is needed to pick up a newly-published quarter for an otherwise-COMPLETE company; --expect-target
    # is the same production-target guard used throughout this session, so a misconfigured MONGODB_URI on
    # the cron service refuses to run rather than writing to the wrong database.
    startCommand: >
      node scripts/earningsXbrlBatch.js
      --expect-target cluster0.yxgjqf0.mongodb.net/test
      --scope with-facts --batch-size 20 --delay-ms 700 --pause-ms 500
      --max-runtime-min 45 --label cron-xbrl-refresh
    envVarGroups:
      - growth-squad-earnings

  - type: cron
    name: earnings-transcript-refresh
    runtime: node
    rootDir: backend
    plan: starter
    # A week after the XBRL refresh, by which point that week's earnings-call transcripts are usually filed too.
    schedule: "0 3 * * 3"
    buildCommand: npm ci --omit=dev
    startCommand: >
      node scripts/collectNseTranscripts.js
      --expect-target cluster0.yxgjqf0.mongodb.net/test
      --concurrency 2 --openai-concurrency 3 --batch-size 15
      --max-runtime-min 45 --max-cost-usd 5 --label cron-transcript-refresh
    envVarGroups:
      - growth-squad-earnings

  - type: cron
    name: earnings-promise-reevaluation
    runtime: node
    rootDir: backend
    plan: starter
    # Friday: after Monday's XBRL refresh and Wednesday's transcript refresh have landed that week's newly
    # filed results, so a PENDING promise whose target period (plus its SEBI reporting window) has closed can
    # be matched against the new actuals. Distinct day from the other two jobs so they never overlap.
    # Like the other jobs, this does nothing until a person connects this Blueprint in the Render dashboard
    # (New > Blueprint) -- committing the file changes nothing live.
    schedule: "0 3 * * 5"
    buildCommand: npm ci --omit=dev
    # Bounded per run (--batch-size / --max-runtime-min) and resumable: the least recently re-evaluated
    # records go first, so the backlog rotates across weekly runs. IndianAPI stays off (no paid API from a
    # cron); ACCEPTED promises only ever get a proposal stored for human review, never an overwritten outcome.
    startCommand: >
      node scripts/reevaluatePromises.js
      --expect-target cluster0.yxgjqf0.mongodb.net/test
      --batch-size 40 --max-runtime-min 30 --label cron-promise-reevaluation
    envVarGroups:
      - growth-squad-earnings
