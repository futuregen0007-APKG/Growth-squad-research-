name: Stocks data refresh

# Keeps Goals' "Load Eligible Stocks" data current WITHOUT depending on a
# developer's laptop, Claude Code, a manual command, or someone visiting the
# site -- and without depending on the Render web service being awake (a
# free/idle Render service can sleep; an in-process timer there would not
# fire). GitHub Actions' own scheduler runs this independently of Render, at
# no additional cost (scheduled workflows are free on GitHub, including for
# private repositories, well within the free-tier minutes this job needs).
#
# Runs scripts/productionBootstrap.js, the existing multi-stage orchestrator
# (see that file) -- this workflow adds no new ingestion logic of its own,
# only the trigger. Scoped to the stock-data stages Goals' recommendation
# pipeline reads (company profiles/market caps, historical prices, derived
# historical metrics, fundamentals, investment products) -- NOT the
# earnings-intelligence stages (earnings-universe, promise-extraction),
# which already have their own scheduled Render Cron Jobs (see render.yaml)
# and their own OpenAI cost budget; running them again here would duplicate
# that work and spend that budget twice.
#
# Schedule: daily at 23:00 IST (17:30 UTC) -- after both NSE's bhavcopy
# (published a few hours after the 15:30 IST market close) and AMFI's NAV
# file (published mid-to-late evening IST) are reliably available for the
# day. GitHub Actions cron is UTC-only; IST has no daylight-saving shift, so
# this offset (UTC+5:30) is fixed year-round.
#
# Required repository secrets (Settings > Secrets and variables > Actions),
# names only -- see the final report for exactly what each is used for:
#   MONGODB_URI       -- same database the Render web service and cron jobs use
#   INDIAN_API_KEY     -- optional; stock-fundamentals stage degrades without it
#   REDIS_URL          -- optional; cache invalidation is best-effort without it

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch: {} # manual "Run workflow" button in the GitHub UI, for on-demand catch-up

# Refuses to start a second run while one is already in progress -- this is
# in ADDITION to, not instead of, the application-level lock
# (services/ScheduledJobRunService.js / productionBootstrap.js's
# stocks-data-bootstrap job) that also protects a manual/local run started
# outside GitHub Actions entirely.
concurrency:
  group: stocks-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --omit=dev

      - name: Run stock-data refresh stages
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          INDIAN_API_KEY: ${{ secrets.INDIAN_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: >
          node scripts/productionBootstrap.js
          --stage=bse-profile-sync,nse-bhavcopy,historical-metrics,stock-fundamentals,investment-products
          --resume --max-runtime=45
          --expect-target=cluster0.yxgjqf0.mongodb.net/test
